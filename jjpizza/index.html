<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Propuesta privada: accesible con el enlace, fuera de buscadores. -->
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>JJ Pizza</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>JJ Pizza</title>
<style>/* vietnamese */
@font-face {

  font-weight: 400 900;
  font-stretch: 62% 125%;
  font-display: swap;
  src: url("fonts/Archivo-400-900-f37014.woff2") format('woff2');
  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
}
/* latin-ext */
@font-face {
  font-family: 'Archivo';
  font-style: normal;
  font-weight: 400 900;
  font-stretch: 62% 125%;
  font-display: swap;
  src: url("fonts/Archivo-400-900-0bcd0d.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
/* latin */
@font-face {
  font-family: 'Archivo';
  font-style: normal;
  font-weight: 400 900;
  font-stretch: 62% 125%;
  font-display: swap;
  src: url("fonts/Archivo-400-900-9b5bcb.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
</style>
<style>/* fallback */
@font-face {
  font-family: 'Material Symbols Rounded';
  font-style: normal;
  font-weight: 500;
  font-display: block;
  src: url("fonts/MaterialSymbolsRounded-500-sub.woff2") format('woff2');
}

.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}
</style>
<style>
html,body{margin:0;background:#ECE5DA}
body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1F1A15}
a{color:#2E6B1F}a:hover{color:#255A18}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:{{ pad }}px;box-sizing:border-box;background:#ECE5DA">
  <div style="display:flex;flex-wrap:nowrap;gap:{{ gap }}px;align-items:flex-start;justify-content:center">
    <sc-for list="{{ phones }}" as="p" hint-placeholder-count="2">
      <div style="flex:none;width:{{ boxW }}px;height:{{ boxH }}px;border-radius:{{ boxR }}px;overflow:hidden;box-shadow:0 24px 60px rgba(31,26,21,.22)">
        <iframe loading="lazy" src="{{ p.src }}" title="{{ p.label }}" style="width:402px;height:874px;border:0;display:block;transform:scale({{ scale }});transform-origin:0 0;background:transparent"></iframe>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { scale: 1 };
  componentDidMount() { this.fit(); this._r = () => this.fit(); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  // Las dos apps siempre lado a lado: se reduce la escala hasta que quepan.
  fit() {
    const W = window.innerWidth, H = window.innerHeight, pad = W < 600 ? 12 : 32;
    const s = Math.max(0.2, Math.min(1, (H - pad * 2) / 874, (W - pad * 2) / (402 * 2 + 48)));
    if (Math.abs(s - this.state.scale) > 0.005 || pad !== this.state.pad) this.setState({ scale: s, pad });
  }
  renderVals() {
    const s = this.state.scale;
    return {
      scale: s.toFixed(3), boxW: Math.round(402 * s), boxH: Math.round(874 * s), boxR: Math.round(48 * s),
      gap: Math.round(48 * s), pad: this.state.pad ?? 32,
      phones: [ { label: 'Customer app', src: 'app.html?embed=1' }, { label: 'Store app', src: 'admin.html?embed=1' } ],
    };
  }
}
</script>


</body></html>
